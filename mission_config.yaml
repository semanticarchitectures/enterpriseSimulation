      name: "al_udeid"
      node_type: "base"
      latitude: 25.117
      longitude: 51.315
      altitude_ft: 0.0
    - entity_id: "node_wp1"
      name: "waypoint_alpha"
      node_type: "waypoint"
      latitude: 28.5
      longitude: 54.0
      altitude_ft: 28000.0
    - entity_id: "node_dz"
      name: "drop_zone_bravo"
      node_type: "drop_zone"
      latitude: 31.2
      longitude: 57.8
      altitude_ft: 1000.0
    - entity_id: "node_wp2"
      name: "waypoint_charlie"
      node_type: "waypoint"
      latitude: 33.0
      longitude: 60.0
      altitude_ft: 28000.0
    - entity_id: "node_dest"
      name: "bagram"
      node_type: "base"
      latitude: 34.946
      longitude: 69.265
      altitude_ft: 0.0
  edges:
