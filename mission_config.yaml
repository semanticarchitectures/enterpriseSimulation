c2_messages:
  - entity_id: "msg_ato"
    name: "ATO"
    source_node: "al_udeid"
    destination_node: "bagram"
    priority: 1
    transmission_latency: 3.0
    classification: "SECRET"
  - entity_id: "msg_airmove"
    name: "AIRMOVE_REQUEST"
    source_node: "al_udeid"
    destination_node: "waypoint_alpha"
    priority: 2
    transmission_latency: 2.0
  - entity_id: "msg_oprep"
    name: "OPREP3"
    source_node: "bagram"
    destination_node: "al_udeid"
    priority: 1
    transmission_latency: 1.5
    classification: "SECRET"

cross_domain_gateway:
  sanitization_latency: 5.0
  enclaves:
    - entity_id: "enc_sipr"
      name: "SIPRNET"
      classification_level: "SECRET"
    - entity_id: "enc_centrixs"
      name: "CENTRIXS"
      classification_level: "SECRET"
  routing_rules:
    - source_enclave: "SIPRNET"
      destination_enclave: "CENTRIXS"
      permitted_classifications:
        - "SECRET"
    - source_enclave: "CENTRIXS"
      destination_enclave: "SIPRNET"
      permitted_classifications:
        - "SECRET"

