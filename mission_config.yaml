    - source: "waypoint_charlie"
      destination: "bagram"
      distance_nm: 200.0
      airspace_classification: "controlled"
  origin: "al_udeid"
  destination: "bagram"

aircraft:
  entity_id: "ac_c17_001"
  aircraft_type: "C-17A Globemaster III"
  lift_to_drag_ratio: 17.5
  specific_fuel_consumption: 0.55
  initial_fuel_weight: 80000.0
  max_fuel_capacity: 100000.0

authorization_chain:
  chain_id: "auth_chain_resupply"
  chain_type: "sequential"
  gates:
    - entity_id: "gate_title10"
      gate_name: "title_10_authority"
      duration: 12.0
      timestamp: 0.0
      start_time: 0.0
    - entity_id: "gate_dipclear"
      gate_name: "diplomatic_clearance"
      duration: 8.0
      timestamp: 0.0
      start_time: 0.0
    - entity_id: "gate_exord"
      gate_name: "execute_order"
      duration: 4.0
      timestamp: 0.0
      start_time: 0.0

